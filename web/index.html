<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태진다이텍 MES 관리 도구 (웹)</title>
<style>
:root{
  --bg:#f3f5f8; --ink:#1d2433; --sub:#5b6474; --line:#d7dce4; --head:#e9edf3;
  --blue:#1565c0; --blue-d:#0d4a8f; --green:#2e7d32; --orange:#ef7d00; --red:#c62828; --teal:#00838f;
  --info:#eef4fb; --info-line:#b7cce4; --title:#1f4e79;
  --err:#ffc7ce; --warn:#ffeb9c; --dup:#ddebf7; --ok:#c6efce; --edit:#fce4d6; --chg:#ffcf9e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #b9c0cc;background:#fff;border-radius:6px;padding:6px 11px;white-space:nowrap}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.45;cursor:default}
.b-blue{background:var(--blue);border-color:var(--blue-d);color:#fff;font-weight:bold}
.b-green{background:var(--green);border-color:#1b5e20;color:#fff;font-weight:bold}
.b-orange{background:var(--orange);border-color:#c66800;color:#fff;font-weight:bold}
.b-red{background:var(--red);border-color:#8e1b1b;color:#fff;font-weight:bold}
.b-teal{background:var(--teal);border-color:#006064;color:#fff;font-weight:bold}
.b-big{padding:8px 15px}
input[type=text],input[type=date],input[type=password],select,textarea{border:1px solid #b9c0cc;border-radius:5px;padding:5px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #90bdf5;outline-offset:0}
input[readonly]{background:#f1f3f6}
label.chk{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#1f3b5c;color:#fff;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;flex:1;min-width:180px}
.top .who{display:flex;align-items:center;gap:6px}
.top .who input{width:110px;padding:3px 8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#999;margin-right:4px}
.dot.ok{background:#4caf50}.dot.bad{background:#f44336}
nav.tabs{display:flex;gap:2px;padding:6px 10px 0;background:#d9dee6;overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
nav.tabs button{border-radius:7px 7px 0 0;border-bottom:none;background:#eef1f5;font-weight:bold;padding:7px 13px}
nav.tabs button.on{background:#1f4e79;color:#fff;border-color:#1f4e79}
main{flex:1;min-height:0;position:relative}
section.page{position:absolute;inset:0;padding:8px 12px;display:none;flex-direction:column;gap:6px;overflow:auto}
section.page.on{display:flex}
.info{background:var(--info);border:1px solid var(--info-line);border-radius:6px;padding:7px 12px;display:flex;gap:10px;align-items:center}
.info .tx{flex:1;min-width:0}
.info b.t{color:var(--title);font-size:14px}
.info .l1{color:#333;margin-top:2px;white-space:pre-line}
.info .l2{color:var(--green);font-weight:bold;margin-top:2px}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bar .sp{flex:1}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.legend{color:var(--sub);font-size:12px}
.status{font-weight:bold;color:#333;min-height:18px}
.status .sum{color:var(--red);font-weight:normal}
.mode-on{background:#fff3e0;border-radius:6px;padding:2px 8px;outline:2px solid var(--orange)}
.sa{background:#c55a11;color:#fff;font-weight:bold;padding:5px 10px;border-radius:5px}
.tbox{flex:1;min-height:200px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;position:relative}
.tbox.fix{flex:none;height:auto;max-height:60vh;min-height:0}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
table.g th,table.g td{border-right:1px solid #e3e6eb;border-bottom:1px solid #e3e6eb;padding:4px 8px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;text-align:left}
table.g th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:bold;user-select:none}
table.g th.sort{cursor:pointer}
table.g td.ck,table.g th.ck{position:sticky;left:0;z-index:1;width:30px;text-align:center;padding:0 4px;background:inherit}
table.g th.ck{z-index:3;background:var(--head)}
table.g tbody tr{background:#fff}
table.g tbody tr:hover{filter:brightness(.97)}
table.g td.num{text-align:right}
table.g td.wrap{white-space:normal;max-width:520px}
tr.err{background:var(--err)!important}tr.warn,tr.hot{background:var(--warn)!important}tr.dup{background:var(--dup)!important}
tr.ok,tr.new{background:var(--ok)!important}tr.edit,tr.upd{background:var(--edit)!important}tr.del{background:var(--err)!important}
tr.off td{color:#999}
tr.sel td{box-shadow:inset 0 2px 0 #2b7de9,inset 0 -2px 0 #2b7de9;font-weight:bold}
td.chg{background:var(--chg)!important}
.more{padding:10px;text-align:center}
.empty{padding:36px;text-align:center;color:var(--sub);white-space:pre-line}
.split{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.split .tbox.tb-top{flex:3}.split .tbox.tb-bot{flex:2}
fieldset{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
legend{font-weight:bold;color:var(--title);padding:0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,auto 1fr);gap:6px 8px;align-items:center}
.grid4 label{text-align:right;font-weight:bold}
/* 창 */
.ov{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.dlg{background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:min(760px,100%);width:100%;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.dlg.wide{max-width:min(1500px,100%);height:calc(100vh - 24px)}
.dlg.mid{max-width:min(980px,100%)}
.dlg h3{margin:0;padding:11px 16px;border-bottom:1px solid var(--line);font-size:15px;color:var(--title)}
.dlg .bd{padding:12px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.dlg .ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg pre{white-space:pre-wrap;font-family:inherit;margin:0;line-height:1.55}
pre.code{font-family:Consolas,"D2Coding",monospace;font-size:12px;background:#f7f8fa;border:1px solid var(--line);padding:10px;overflow:auto;white-space:pre;flex:1}
mark{background:#ffeb3b}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:90;display:none;align-items:center;justify-content:center}
.busy.on{display:flex}
.busy .box{background:#1f3b5c;color:#fff;padding:14px 22px;border-radius:8px;font-weight:bold;max-width:90vw;text-align:center}
.busy .box button{margin-top:10px}
.form{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center}
.form .lab{font-weight:bold}
.form .note{grid-column:2;font-size:12px;color:var(--sub);margin-top:-4px}
.note.bad,.bad{color:var(--red)}.note.good,.good{color:var(--green)}
.hint{color:var(--sub);font-size:12px}
.red{color:var(--red)}
.list{border:1px solid var(--line);border-radius:6px;max-height:50vh;overflow:auto}
.list div{padding:6px 10px;border-bottom:1px solid #eef0f3;cursor:pointer}
.list div:hover{background:#e3efff}
.list div.w{background:var(--warn)}
.sg{position:relative;display:inline-flex}
.sg input{border-top-right-radius:0;border-bottom-right-radius:0}
.sg button{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;padding:5px 8px}
.sg-pop{position:fixed;z-index:80;background:#fff;border:1px solid #9aa6b8;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);overflow:auto;min-width:200px}
.sg-pop div{padding:6px 10px;cursor:pointer;white-space:nowrap}
.sg-pop div.on,.sg-pop div:hover{background:#e3efff}
.qf{background:#fff7e6;border:1px solid #f0c36d;border-radius:6px;padding:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qf .t{font-weight:bold;color:#c55a11}
.lg{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.lg span{border:1px solid #888;padding:1px 6px;border-radius:3px}
.small{width:72px}.tiny{width:52px}
.help h1{color:var(--title);font-size:19px;margin:6px 0}
.help h2{color:var(--title);font-size:15px;margin:16px 0 4px}
.help p{margin:4px 0}
.help li{margin:3px 0}
.help{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 22px;overflow:auto;flex:1;line-height:1.6}
td input.cell{width:100%;min-width:90px;padding:2px 4px}
@media (max-width:820px){
  section.page{padding:6px}
  .tbox{min-height:55vh}
  .bar .sp{display:none}
  .bar.act button{flex:1 1 46%}
  .info .l1,.info .l2{font-size:12px}
  .info button{display:none}
  .dlg{max-height:100vh;border-radius:0}
  .ov{padding:0}
  .dlg.wide,.dlg.mid,.dlg{max-width:100%;height:100%}
  .form{grid-template-columns:1fr}
  .form .note{grid-column:1}
  .grid4{grid-template-columns:auto 1fr}
  .grid4 label{text-align:left}
  .top h1{font-size:13px}
  .split .tbox{min-height:40vh}
}
</style>
</head>
<body>
<div class="top">
  <h1 id="apptitle">태진다이텍 MES 관리 도구 (웹)</h1>
  <span id="db" title="MES 접속 상태"><span class="dot"></span><span id="dbt">확인 중</span></span>
  <span class="who">작업자 <input id="who" type="text" placeholder="이름" maxlength="20"></span>
</div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="busy" id="busy"><div class="box"><div id="busyT">처리 중...</div><div id="busyC"></div></div></div>

<script>
"use strict";
/* ============================================================
   공통 도구
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KB = 3;
const blen = s => [...s].reduce((n, ch) => n + (ch.charCodeAt(0) < 128 ? 1 : KB), 0);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const LS = {get(k, d){try{return localStorage.getItem(k) ?? d}catch(e){return d}}, set(k, v){try{localStorage.setItem(k, v)}catch(e){}}};
let META = null;

let busyN = 0;
function busy(on, text){
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  if (text) $("#busyT").textContent = text;
  if (!busyN) $("#busyC").innerHTML = "";
  $("#busy").classList.toggle("on", busyN > 0);
}
let PIN = "";
try { PIN = sessionStorage.getItem("pin") || ""; } catch(e) {}
const headers = () => ({"Content-Type": "application/json", "X-User": encodeURIComponent($("#who").value.trim()), "X-Pin": PIN});

async function rawPost(path, body){
  let r;
  try { r = await fetch(path, {method: "POST", headers: headers(), body: JSON.stringify(body || {})}); }
  catch (e) { throw new Error("서버에 연결할 수 없습니다.\n서버 PC가 켜져 있고 서버 창이 열려 있는지 확인하세요."); }
  if (r.status === 401) {
    let j = {}; try { j = await r.clone().json(); } catch(e) {}
    if (j.pin) {
      const p = await ask("PIN 입력", "접속 PIN을 넣으세요.", "", "password");
      if (p === null) throw Object.assign(new Error("PIN이 필요합니다."), {kind: "warn"});
      PIN = p; try { sessionStorage.setItem("pin", p); } catch(e) {}
      return rawPost(path, body);
    }
  }
  return r;
}
async function api(path, body, text){
  // text === null : 화면을 막지 않고 조용히 (줄 클릭할 때 읽기 등 - 더블클릭이 막히지 않게)
  const quiet = text === null;
  if (!quiet) busy(true, text || "MES와 주고받는 중...");
  try {
    const r = await rawPost(path, body);
    let j = {};
    try { j = await r.json(); } catch(e) { j = {error: `서버 응답 오류 (${r.status})`}; }
    if (!r.ok) throw Object.assign(new Error(j.error || `오류 ${r.status}`), {kind: j.kind});
    return j;
  } finally { if (!quiet) busy(false); }
}
async function apiFile(path, body, text){
  busy(true, text || "파일 만드는 중...");
  try {
    const r = await rawPost(path, body);
    if (!r.ok) { let j = {}; try { j = await r.json(); } catch(e) {} throw Object.assign(new Error(j.error || `오류 ${r.status}`), {kind: j.kind}); }
    const blob = await r.blob();
    const m = (r.headers.get("Content-Disposition") || "").match(/filename\*=UTF-8''([^;]+)/);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = m ? decodeURIComponent(m[1]) : "파일";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  } finally { busy(false); }
}
async function apiJob(path, body, title){
  const st = await api("/api/job/start", {path, body}, title);
  busy(true, title || "확인 중...");
  let stop = false;
  $("#busyC").innerHTML = `<button id="jobStop">취소</button>`;
  $("#jobStop").onclick = async () => { stop = true; $("#busyT").textContent = "취소하는 중... (지금 확인 중인 표가 끝나면 멈춥니다)"; try { await rawPost("/api/job/cancel", {id: st.id}); } catch(e) {} };
  try {
    while (true) {
      await new Promise(r => setTimeout(r, 500));
      const r = await rawPost("/api/job/poll", {id: st.id});
      const j = await r.json();
      if (!r.ok) throw Object.assign(new Error(j.error), {kind: j.kind});
      if (j.done) {
        if (j.error) throw Object.assign(new Error(j.error), {kind: j.kind});
        return j.result;
      }
      if (!stop) $("#busyT").textContent = j.msg;
    }
  } finally { busy(false); }
}
function pickFile(accept){
  return new Promise(res => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = accept || ".xlsx,.xlsm";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return res(null);
      const rd = new FileReader();
      rd.onload = () => res({name: f.name, b64: rd.result});
      rd.readAsDataURL(f);
    };
    inp.click();
  });
}

/* ---------- 창 (알림·확인·입력) ---------- */
function dialog({title, html, buttons, cls, onOpen}){
  return new Promise(res => {
    const ov = document.createElement("div");
    ov.className = "ov";
    ov.innerHTML = `<div class="dlg ${cls || ""}"><h3>${esc(title)}</h3><div class="bd">${html}</div><div class="ft"></div></div>`;
    const ft = $(".ft", ov);
    const close = v => { ov.remove(); document.removeEventListener("keydown", key); res(v); };
    (buttons || [{t: "확인", v: true, c: "b-blue"}]).forEach(b => {
      const el = document.createElement("button");
      el.textContent = b.t; if (b.c) el.className = b.c;
      el.onclick = async () => { if (b.check && !(await b.check(ov))) return; close(b.get ? b.get(ov) : b.v); };
      ft.appendChild(el);
    });
    const key = e => {
      if (!document.body.contains(ov) || ov !== $$(".ov").pop()) return;
      if (e.key === "Escape") { e.stopPropagation(); ft.firstChild.click(); }
    };
    document.addEventListener("keydown", key);
    document.body.appendChild(ov);
    ov.close = close;
    if (onOpen) onOpen(ov, close);
    const f = $("input:not([type=checkbox]):not([readonly]),textarea", ov) || ft.lastChild;
    if (f) setTimeout(() => f.focus(), 30);
  });
}
const pre = t => `<pre>${esc(t)}</pre>`;
const alertBox = (msg, title) => dialog({title: title || "알림", html: pre(msg)});
const warnBox = msg => dialog({title: "확인하세요", html: `<pre class="red">${esc(msg)}</pre>`});
const confirmBox = (msg, title, okText, danger) => dialog({title: title || "확인", html: pre(msg),
  buttons: [{t: "취소", v: false}, {t: okText || "예", v: true, c: danger ? "b-red" : "b-blue"}]});
function ask(title, msg, init, type){
  return dialog({title, html: `${pre(msg)}<input type="${type || "text"}" id="askv" style="width:100%" value="${esc(init ?? "")}">`,
    buttons: [{t: "취소", v: null}, {t: "확인", c: "b-blue", get: ov => $("#askv", ov).value}],
    onOpen: (ov, close) => { const i = $("#askv", ov); setTimeout(() => i.select(), 40); i.onkeydown = e => { if (e.key === "Enter") close(i.value); }; }});
}
function showErr(e){
  const m = (e && e.message) || String(e);
  return e && e.kind === "warn" ? warnBox(m) : dialog({title: "오류", html: `<pre class="red">${esc(m)}</pre>`});
}
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { showErr(e); } };

/* ---------- 표 (선택·체크·더블클릭·찾기·정렬·나눠 보이기) ---------- */
class Table {
  constructor(box, o = {}){
    this.box = box; this.o = Object.assign({check: true, page: 400}, o);
    this.heads = []; this.rows = []; this.view = []; this.sel = new Set(); this.anchor = null;
    this.q = ""; this.sc = null; this.rev = false; this.shown = 0;
    box.classList.add("tbox");
    box.addEventListener("click", e => this.click(e));
    box.addEventListener("dblclick", e => this.dbl(e));
    this.empty(o.emptyText || "");
  }
  empty(t){ this.box.innerHTML = `<div class="empty">${esc(t)}</div>`; }
  set(heads, rows, keepSel){ this.heads = heads; this.rows = rows; if (!keepSel) { this.sel.clear(); this.anchor = null; } this.render(); }
  val(i, c){ return this.o.val ? this.o.val(i, c) : this.rows[i][c]; }
  filter(q){ this.q = String(q || "").toLowerCase(); this.render(); }
  render(){
    const q = this.q;
    this.view = [];
    for (let i = 0; i < this.rows.length; i++) {
      if (q && !this.rows[i].some((_, c) => String(this.val(i, c)).toLowerCase().includes(q))) continue;
      this.view.push(i);
    }
    if (this.sc !== null) {
      const k = i => { const v = String(this.val(i, this.sc) ?? ""); const f = parseFloat(v.replace(/,/g, "")); return v === "" ? null : (/^-?[\d,.]+$/.test(v) && !isNaN(f) ? [0, f] : [1, v.toLowerCase()]); };
      const filled = this.view.filter(i => k(i) !== null), emp = this.view.filter(i => k(i) === null);
      filled.sort((a, b) => { const x = k(a), y = k(b); return (x[0] - y[0] || (x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0)) * (this.rev ? -1 : 1); });
      this.view = filled.concat(emp);
    }
    if (!this.rows.length) { this.empty(this.o.noRows || "자료가 없습니다."); this.shown = 0; return; }
    const th = this.heads.map((h, c) => `<th class="${this.o.sort ? "sort" : ""}" data-c="${c}" title="${esc(h)}">${esc(h)}${this.sc === c ? (this.rev ? " ▼" : " ▲") : ""}</th>`).join("");
    this.box.innerHTML = `<table class="g"><thead><tr>${this.o.check ? `<th class="ck"><input type="checkbox" class="all" title="보이는 줄 모두 선택"></th>` : ""}${th}</tr></thead><tbody></tbody></table><div class="more"></div>`;
    this.shown = 0;
    this.more();
  }
  more(){
    const a = this.shown, b = Math.min(this.view.length, a + this.o.page);
    $("tbody", this.box).insertAdjacentHTML("beforeend", this.view.slice(a, b).map(i => this.rowHtml(i)).join(""));
    this.shown = b;
    const left = this.view.length - b, m = $(".more", this.box);
    m.innerHTML = left > 0 ? `<button>더 보기 (${Math.min(this.o.page, left).toLocaleString()}줄 더 / 남은 ${left.toLocaleString()}줄)</button>` : "";
    if (left > 0) $("button", m).onclick = () => this.more();
  }
  rowHtml(i){
    const cls = (this.o.rowCls ? this.o.rowCls(i) : "") + (this.sel.has(i) ? " sel" : "");
    const tds = this.rows[i].map((_, c) => {
      const v = this.val(i, c), cc = this.o.cellCls ? this.o.cellCls(i, c) : "";
      return `<td class="${cc}" title="${esc(v)}">${esc(v)}</td>`;
    }).join("");
    return `<tr data-i="${i}" class="${cls}">${this.o.check ? `<td class="ck"><input type="checkbox"${this.sel.has(i) ? " checked" : ""}></td>` : ""}${tds}</tr>`;
  }
  refreshRow(i){ const tr = $(`tr[data-i="${i}"]`, this.box); if (tr) tr.outerHTML = this.rowHtml(i); }
  refreshSel(){
    $$("tbody tr", this.box).forEach(tr => { const on = this.sel.has(+tr.dataset.i); tr.classList.toggle("sel", on); const c = $("td.ck input", tr); if (c) c.checked = on; });
    this.o.onSel && this.o.onSel();
  }
  picked(){ return [...this.sel].sort((a, b) => a - b); }
  click(e){
    const th = e.target.closest("th");
    if (th) {
      if (e.target.classList.contains("all")) { this.sel.clear(); if (e.target.checked) this.view.forEach(i => this.sel.add(i)); return this.refreshSel(); }
      if (this.o.sort && th.dataset.c !== undefined) { const c = +th.dataset.c; if (this.sc === c) this.rev = !this.rev; else { this.sc = c; this.rev = false; } this.render(); }
      return;
    }
    const tr = e.target.closest("tbody tr"); if (!tr) return;
    const i = +tr.dataset.i;
    if (e.target.closest("td.ck")) { if (e.target.tagName !== "INPUT") return; e.target.checked ? this.sel.add(i) : this.sel.delete(i); this.anchor = i; return this.refreshSel(); }
    if (e.target.tagName === "INPUT") return;
    if (e.shiftKey && this.anchor !== null) {
      const a = this.view.indexOf(this.anchor), b = this.view.indexOf(i);
      if (!e.ctrlKey && !e.metaKey) this.sel.clear();
      this.view.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => this.sel.add(x));
    } else if (e.ctrlKey || e.metaKey) { this.sel.has(i) ? this.sel.delete(i) : this.sel.add(i); this.anchor = i; }
    else { this.sel.clear(); this.sel.add(i); this.anchor = i; this.o.onPick && this.o.onPick(i); }
    this.refreshSel();
  }
  dbl(e){
    const td = e.target.closest("tbody td"); if (!td || td.classList.contains("ck") || e.target.tagName === "INPUT") return;
    const tr = td.parentNode, i = +tr.dataset.i, c = [...tr.children].indexOf(td) - (this.o.check ? 1 : 0);
    window.getSelection && window.getSelection().removeAllRanges();
    this.o.onDbl && this.o.onDbl(i, c, td);
  }
}

/* ---------- 글자 치면 걸러지는 입력칸 ---------- */
class Suggest {
  constructor(input, {items = [], onPick, onChange, rows = 14} = {}){
    this.inp = input; this.items = items; this.onPick = onPick; this.onChange = onChange; this.rows = rows;
    this.pop = null; this.shown = []; this.hi = -1; this.last = input.value;
    const w = document.createElement("span"); w.className = "sg";
    input.parentNode.insertBefore(w, input); w.appendChild(input);
    const b = document.createElement("button"); b.type = "button"; b.textContent = "▼"; b.tabIndex = -1;
    w.appendChild(b);
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => { if (this.pop) this.close(); else { this.open(""); this.inp.focus(); } };
    input.addEventListener("input", () => { const t = this.get(); if (t !== this.last) { this.last = t; this.onChange && this.onChange(t); } this.open(t); });
    input.addEventListener("keydown", e => this.key(e));
    input.addEventListener("blur", () => setTimeout(() => this.close(), 150));
  }
  get(){ return this.inp.value.trim(); }
  set(v){ this.inp.value = v; this.last = v; }
  setItems(items){ this.items = items; }
  open(text){
    const t = String(text || "").toUpperCase().replace(/\s/g, "");
    this.shown = this.items.filter(([v, d]) => !t || String(v).toUpperCase().replace(/\s/g, "").includes(t) || String(d).toUpperCase().replace(/\s/g, "").includes(t)).slice(0, 400);
    if (!this.shown.length) return this.close();
    if (!this.pop) { this.pop = document.createElement("div"); this.pop.className = "sg-pop"; this.pop.onmousedown = e => e.preventDefault(); document.body.appendChild(this.pop); }
    this.hi = -1;
    this.pop.innerHTML = this.shown.map(([v, d], i) => `<div data-i="${i}">${esc(d || v)}</div>`).join("");
    this.pop.onclick = e => { const d = e.target.closest("div[data-i]"); if (d) this.pick(+d.dataset.i); };
    const r = this.inp.parentNode.getBoundingClientRect();
    const h = Math.min(this.rows * 29 + 4, window.innerHeight * .6), below = window.innerHeight - r.bottom - 8, above = r.top - 8;
    this.pop.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 260)) + "px";
    this.pop.style.minWidth = r.width + "px";
    this.pop.style.maxWidth = Math.min(700, window.innerWidth - 8) + "px";
    if (below >= Math.min(h, 160) || below >= above) { this.pop.style.maxHeight = Math.min(h, below) + "px"; this.pop.style.top = r.bottom + 2 + "px"; }
    else { const mh = Math.min(h, above); this.pop.style.maxHeight = mh + "px"; this.pop.style.top = Math.max(4, r.top - Math.min(mh, this.pop.scrollHeight) - 2) + "px"; }
  }
  mark(i){ if (!this.pop) return; const ds = this.pop.children; if (ds[this.hi]) ds[this.hi].classList.remove("on"); this.hi = Math.max(0, Math.min(i, ds.length - 1)); if (ds[this.hi]) { ds[this.hi].classList.add("on"); ds[this.hi].scrollIntoView({block: "nearest"}); } }
  key(e){
    if (e.key === "ArrowDown") { e.preventDefault(); if (!this.pop) this.open(this.get()); this.mark(this.hi + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); this.mark(this.hi - 1); }
    else if (e.key === "Escape" && this.pop) { e.stopPropagation(); this.close(); }
    else if (e.key === "Enter" && this.pop) {
      if (this.hi >= 0) { e.preventDefault(); e.stopPropagation(); this.pick(this.hi); }
      else if (this.shown.length === 1) { e.preventDefault(); e.stopPropagation(); this.pick(0); }
    }
  }
  pick(i){ const it = this.shown[i]; if (!it) return; this.set(it[0]); this.close(); this.inp.focus(); this.onPick && this.onPick(it[0]); }
  close(){ if (this.pop) { this.pop.remove(); this.pop = null; } }
}

/* 칸 값 형식 검사 (서버도 다시 검사함) */
function normalize(d, text){
  const t = String(text ?? "").trim();
  if (!t) { if (d.req) throw new Error("필수 칸이라 비울 수 없음"); return ""; }
  if (d.type === "NUM") {
    const f = Number(t.replace(/,/g, ""));
    if (!isFinite(f)) throw new Error("숫자 아님");
    if (f < 0) throw new Error("음수는 넣을 수 없습니다");
    return String(f);
  }
  if (d.type === "DATE") {
    const m = t.replace(/[./]/g, "-").match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::\d{2})?)?$/) || t.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (!m) throw new Error("날짜 아님 (예: 2026-09-30)");
    const s = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
    return m[4] && (+m[4] || +m[5]) ? `${s} ${pad(+m[4])}:${m[5]}` : s;
  }
  if (d.maxlen && blen(t) > d.maxlen) throw new Error(`너무 김 (${blen(t)}/${d.maxlen}byte)`);
  return t;
}
const sameVal = (d, a, b) => a === b || (d.type === "NUM" && a !== "" && b !== "" && Number(a) === Number(b)) || (d.type === "TEXT" && String(a).trimEnd() === b);

/* 표 칸 안에서 바로 고치기 */
function inlineEdit(td, cur, done){
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = cur; inp.className = "cell";
  td.textContent = ""; td.appendChild(inp); td.style.overflow = "visible";
  inp.focus(); inp.select();
  let fin = false;
  const finish = c => { if (fin) return; fin = true; done(c ? inp.value : null); };
  inp.onkeydown = e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") { e.stopPropagation(); finish(false); } };
  inp.onblur = () => finish(true);
}

/* 세로로 보기 / 수정 (한 줄 전체 칸) */
function vertical(title, rows, {note, canEdit, onEdit, onSave} = {}){
  // rows: () => [{col, name, val, type, edited, off}]
  return dialog({title, cls: "mid",
    html: `<div class="hint">${esc(note || "")}</div><input type="text" class="vq" placeholder="컬럼 찾기" style="width:220px">
      <div class="tbox fix vt"></div>`,
    buttons: onSave ? [{t: "닫기", v: null}, {t: "수정 저장", c: "b-green", v: "save"}] : [{t: "닫기", v: null}],
    onOpen: ov => {
      const t = new Table($(".vt", ov), {check: false, rowCls: i => cur[i].edited ? "edit" : (cur[i].off ? "off" : ""),
        cellCls: (i, c) => c === 2 && cur[i].edited ? "chg wrap" : (c === 2 ? "wrap" : ""),
        onDbl: async i => { if (!canEdit) return; await onEdit(cur[i].col); fill(); }});
      let cur = [];
      const fill = () => { cur = rows(); t.set(["DB컬럼", "이름", "값", "형식"], cur.map(r => [r.col, r.name, r.val, r.type]), true); t.filter($(".vq", ov).value); };
      $(".vq", ov).oninput = e => t.filter(e.target.value);
      fill();
    }}).then(v => { if (v === "save" && onSave) onSave(); });
}

    val: (i, c) => { const e = S.edits.get(S.data.rids[i]); const col = S.data.cols[c]; return e && e.changes[col] ? e.changes[col].new : S.data.rows[i][c]; },
    rowCls: i => S.edits.has(S.data.rids[i]) ? "edit" : (S.data.tags[i] || ""),
    cellCls: (i, c) => { const e = S.edits.get(S.data.rids[i]); return e && e.changes[S.data.cols[c]] ? "chg" : (S.data.defs[S.data.cols[c]] || {}).type === "NUM" ? "num" : ""; },

  const filters = () => {

  function updSave(){ let n = 0; S.edits.forEach(e => n += Object.keys(e.changes).length); q(".g-save").textContent = `수정 저장 (${n})`; }

    S.edits.clear(); updSave(); fetch(false);
  });

      lookup(true);

async function findItem(q, path, moldCol){
  let j;
  try { j = await api(path, {q}, "품번 찾는 중..."); } catch (e) { showErr(e); return null; }
  return dialog({title: "품번 찾기 (누르면 선택)", cls: "mid",
    html: `<input type="text" class="fq" value="${esc(q)}" placeholder="거르기" style="width:100%"><div class="list fl"></div><div class="hint">${j.rows.length}건 (최대 300)${moldCol ? " &nbsp; 노랑 = 금형 연결 없음" : ""}</div>`,
    buttons: [{t: "닫기", v: null}],
    onOpen: (ov, close) => {
      const fill = () => { const t = $(".fq", ov).value.trim().toUpperCase();
        $(".fl", ov).innerHTML = j.rows.filter(r => !t || (r[0] + " " + r[1]).toUpperCase().includes(t)).map(r =>
          `<div data-v="${esc(r[0])}" class="${moldCol && !r[2] ? "w" : ""}"><b>${esc(r[0])}</b> &nbsp; ${esc(r[1])}${moldCol ? ` &nbsp; <span class="hint">금형 ${esc(r[2] || "(없음)")}</span>` : ""}</div>`).join(""); };
      $(".fq", ov).oninput = fill;
      $(".fl", ov).onclick = e => { const d = e.target.closest("div[data-v]"); if (d) close(d.dataset.v); };
      fill();
    }});
}

/* ---------- 여러 건 일괄등록 (기존 WoBatch) ---------- */
const BCOLS = ["No", "설비(입력)", "계획일자", "교대조", "품번", "계획수량", "순위", "설비코드", "품명", "금형", "작업지시번호", "상태", "최근작업일", "최근SPM"];
let LISTS = null;
function parseLooseDate(t){
  t = String(t || "").trim().split(" ")[0];
  if (!t) return null;
  let m;
  if ((m = t.match(/^(\d{1,2})[/.-](\d{1,2})$/))) return `${new Date().getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`;
  if (/^\d{5}(\.0)?$/.test(t)) return new Date(Date.UTC(1899, 11, 30) + parseInt(t) * 864e5).toISOString().slice(0, 10);
  if ((m = t.match(/^(\d{4})(\d{2})(\d{2})$/)) || (m = t.match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  return null;
}
async function openBatch(recentHours, recentDate){
  if (!LISTS) {
    try {
      const j = await api("/api/batch/lists", {}, "설비·품번 목록 읽는 중...");
      const L = {machines: j.machines, mc_items: j.mc_items, item_mcs: j.item_mcs, names: {}, last: {}};
      L.mc_all = Object.entries(j.machines).map(([c, n]) => [n || c, `${n || c}   (${c})`]).sort((a, b) => a[0].localeCompare(b[0], "ko"));
      L.item_list = j.items.map(([k, nm, mc]) => { L.names[k] = nm; if (mc) L.last[k.toUpperCase()] = mc; const mn = j.machines[mc] || mc; return [k, `${k}   |  ${nm || "-"}` + (mn ? `   |  최근 ${mn}` : "")]; });
      LISTS = L;
    } catch (e) { await warnBox("설비·품번 목록을 읽지 못했습니다 (직접 입력은 됩니다).\n" + e.message); }
  }
  const LL = LISTS || {machines: {}, mc_items: {}, item_mcs: {}, names: {}, last: {}, mc_all: [], item_list: []};
  const B = {rows: [], sel: new Set(), hours: recentHours || null, spm: [null, 1, ""], applied: false, sort: null, rev: false};
  const recent = !!recentHours, plan = recentDate || today();
  const head = recent

  dialog({title: recent ? "최근 30일 작업지시 - 등록 예정" : "작업지시 여러 건 일괄등록", html, cls: "wide",

  function setup(ov){

    function curMc(){ const t = fm.get(); if (LL.machines.hasOwnProperty(t)) return t; const n = t.replace(/\s/g, "").toUpperCase(); for (const [c, nm] of Object.entries(LL.machines)) if (nm && nm.replace(/\s/g, "").toUpperCase() === n) return c; return ""; }
    function refreshMachines(item){
      item = (item === undefined ? fi.get() : item).toUpperCase();

      if (q("#q_allmc").checked || !hist) { fm.setItems(LL.mc_all); return []; }
      fm.setItems(hist.map(([mc, n, last]) => { const nm = LL.machines[mc] || mc; return [nm, `${nm}   (${mc})   |  ${n}회` + (last ? `, 마지막 ${last.slice(2, 10).replace(/-/g, "/")}` : "")]; }));

    function refreshItems(){

      if (q("#q_allit").checked || !mc || !LL.mc_items[mc]) return fi.setItems(LL.item_list);
      fi.setItems(LL.mc_items[mc].map(([it, n, last]) => [it, `${it}   |  ${LL.names[it] || "-"}   |  ${n}회` + (last ? `, 마지막 ${last.slice(5, 10).replace("-", "/")}` : "")]));
    }
    function onMcPick(){ refreshItems(); const it = fi.get().toUpperCase(), mc = curMc(); if (it && mc && (LL.item_mcs[it] || []).some(x => x[0] === mc)) return updateSpm(it); fi.set(""); refreshMachines(""); q("#q_it").focus(); fi.open(""); }

      const hist = refreshMachines(item), mc = curMc();

      else if (!hist.length && !fm.get() && LL.last[item]) fm.set(LL.machines[LL.last[item]] || LL.last[item]);
      updateSpm(item);
    }
    async function updateSpm(item){
      try { const j = await api("/api/batch/spm", {mc: curMc(), item}, "SPM 찾는 중..."); B.spm = [j.spm, j.cav, j.src]; }

      q("#q_spm").value = B.spm[0] ? B.spm[0].toFixed(1) : ""; q("#q_src").textContent = B.spm[2].slice(0, 60);
      if (B.spm[0]) calcQty(); else q("#q_qty").value = "";
      q("#q_qty").focus(); q("#q_qty").select();
    }
    function calcQty(){ const s = parseFloat(q("#q_spm").value.replace(/,/g, "")); if (s > 0) q("#q_qty").value = String(Math.round(s * 60 * hours() * (B.spm[1] || 1) / 10) * 10); }
    hR.forEach(r => r.onchange = () => { q("#q_hman").value = ""; calcQty(); });
    q("#q_hman").oninput = calcQty; q("#q_spm").oninput = calcQty;

    function quickAdd(){

      B.rows.push({line: m, date_t: "", shift: "", item: it, qty_t: n, prio: "", st: "", lv: ""}); dirty(); show();
      fi.set(""); q("#q_qty").value = q("#q_spm").value = ""; q("#q_src").textContent = ""; refreshMachines(""); q("#q_it").focus();
      lbl(`${B.rows.length}줄  →  다 넣었으면 [검사]`);
    }
    /* 붙여넣기 */
    function pasteText(text){
      let added = 0, skipped = 0;
      for (const line of text.replace(/\r\n?/g, "\n").split("\n")) {
        if (!line.trim()) continue;
        let c = line.split("\t").map(x => x.trim());
        while (c.length && c[c.length - 1] === "") c.pop();
        if (c.length >= 7 && /^\d*$/.test(c[0]) && (c.length === 7 || !parseLooseDate(c[1]))) c = c.slice(1);
        if (c.length >= 5 && parseLooseDate(c[1])) { while (c.length < 6) c.push(""); B.rows.push({line: c[0], date_t: c[1], shift: c[2], item: c[3], qty_t: c[4], prio: c[5], st: "", lv: ""}); added++; continue; }
        if (c.length >= 3 && /^[\d,]+(\.\d+)?$/.test(c[2])) { B.rows.push({line: c[0], date_t: "", shift: "", item: c[1], qty_t: c[2], prio: "", st: "", lv: ""}); added++; continue; }
        skipped++;
      }
      dirty(); show(); lbl(`${added}줄 붙여넣음` + (skipped ? ` (${skipped}줄 건너뜀: 제목줄·빈칸 등)` : "") + "  →  [검사]를 누르세요.");
    }
    ov.addEventListener("paste", e => { if (e.target.closest("input,textarea")) return; const t = (e.clipboardData || window.clipboardData).getData("text"); if (t) { e.preventDefault(); pasteText(t); } });
    q("#b_paste").onclick = async () => {
      try { if (navigator.clipboard && navigator.clipboard.readText) { const t = await navigator.clipboard.readText(); if (t) return pasteText(t); } } catch (e) {}
      const t = await dialog({title: "붙여넣기", html: `<div class="hint">엑셀에서 복사한 내용을 아래 칸에 붙여넣고 [추가]를 누르세요.</div><textarea id="pt" style="width:100%;height:240px"></textarea>`,
        buttons: [{t: "취소", v: null}, {t: "추가", c: "b-blue", get: o => $("#pt", o).value}]});
      if (t) pasteText(t);
    };
    /* 고치기 */
    const mcCodeOf = t => { t = String(t || "").trim(); if (LL.machines.hasOwnProperty(t)) return t; const n = t.replace(/\s/g, "").toUpperCase(); for (const [c, nm] of Object.entries(LL.machines)) if (nm && nm.replace(/\s/g, "").toUpperCase() === n) return c; return ""; };
    const itemChoices = line => { const all = [...new Set(LL.item_list.map(x => x[0]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko")); const mc = mcCodeOf(line); return [all, mc ? [...new Set((LL.mc_items[mc] || []).map(x => x[0]))].sort((a, b) => a.localeCompare(b, "ko")) : []]; };
    const lineChoices = item => { const all = [...new Set(LL.mc_all.map(x => x[0]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko")); return [all, [...new Set((LL.item_mcs[String(item || "").trim().toUpperCase()] || []).map(([mc]) => LL.machines[mc] || mc))].sort((a, b) => a.localeCompare(b, "ko"))]; };
    async function editCell(i, c){
      const r = B.rows[i], keys = {1: "line", 2: "date_t", 3: "shift", 4: "item", 5: "qty_t", 6: "prio"};

        }, get: o => Object.fromEntries(f.map(([, k]) => [k, $("#e_" + k, o).value.trim()]))}],
        onOpen: o => { new Suggest($("#e_line", o), {items: lineChoices("")[0].map(x => [x, x]), rows: 20}); new Suggest($("#e_item", o), {items: itemChoices("")[0].map(x => [x, x]), rows: 20}); }});
      if (!res) return;
      Object.assign(r, res); r.item = r.item.toUpperCase(); clearDerived(r); r.st = "수정됨 - 검사 필요"; r.lv = ""; dirty(); show();

    /* 검사·번호·반영 */

    });
    async function makeNo(){
      if (!B.rows.length) { alertBox("붙여넣은 줄이 없습니다."); return false; }
      const j = await api("/api/batch/make_no", send(), "작업지시번호 만드는 중..."); merge(j.rows); show();
      if (j.error) { warnBox(j.error); return false; }
      lbl(`작업지시번호 ${B.rows.length}개 생성 (아직 저장 안 됨)  ${j.note ? "· 규칙: " + j.note : "· 같은 날 기존 번호 형식 사용"}  →  번호 확인 후 [작업지시 반영]`);

function askPick(title, labelText, all, hist, histText){
  return dialog({title,
    html: `<b>${esc(labelText)}</b><div class="hint">글자를 치면 바로 걸러집니다. 누르면 고르기, 목록에 없으면 직접 입력 후 [확인]</div>
      <input type="text" id="pk" style="width:100%">${hist.length ? `<label class="chk"><input type="checkbox" id="pkh" checked> ${esc(histText)}만 보기 (${hist.length}개)</label>` : ""}
      <div class="list" id="pkl"></div><div class="hint" id="pkc"></div>`,
    buttons: [{t: "취소", v: null}, {t: "확인", c: "b-blue", get: ov => $("#pk", ov).value.trim() || null}],
    onOpen: (ov, close) => {
      let shown = [];
      const fill = () => { const src = $("#pkh", ov) && $("#pkh", ov).checked ? hist : all, t = $("#pk", ov).value.trim().toUpperCase().replace(/\s/g, "");
        shown = src.filter(x => !t || x.toUpperCase().replace(/\s/g, "").includes(t));
        $("#pkl", ov).innerHTML = shown.slice(0, 500).map(x => `<div data-v="${esc(x)}">${esc(x)}</div>`).join("");
        $("#pkc", ov).textContent = `${shown.length.toLocaleString()}개 / 전체 ${src.length.toLocaleString()}개`; };
      $("#pk", ov).oninput = fill;
      $("#pk", ov).onkeydown = e => { if (e.key === "Enter") { const t = e.target.value.trim(); close(shown.length === 1 ? shown[0] : (t || null)); } };
      if ($("#pkh", ov)) $("#pkh", ov).onchange = fill;
      $("#pkl", ov).onclick = e => { const d = e.target.closest("div[data-v]"); if (d) close(d.dataset.v); };
      fill();
    }});
}

      ${isNew ? `<label class="chk"><input type="checkbox" id="rf_keep"> 등록 후 창 유지 (다음 코일 계속 입력)</label>` : `<div class="${lock ? "red" : "good"}">${lock ? `생산 사용 ${u.use}건 / 출고 ${u.iss}건 / 취소줄 ${u.cancel}건 → 업체·담당자만 고칠 수 있습니다` : "사용 이력 없음 - 모든 칸을 고칠 수 있습니다"}</div>`}`;
    const vals = ov => ({date: $("#rf_date", ov).value, item: $("#rf_item", ov).value, heat: $("#rf_heat", ov).value, vendor: $("#rf_vendor", ov).value,
      kg: $("#rf_kg", ov).value, qty: $("#rf_qty", ov).value, charger: $("#rf_chg", ov).value, no: $("#rf_no", ov).value});
    let noAuto = isNew;
    dialog({title: isNew ? "소재 새 입고" : `소재 입고 고치기 - ${v.no}`, cls: "mid", html,
      buttons: [{t: "닫기", v: null}, {t: isNew ? "MES에 등록" : "수정 저장", c: "b-green b-big", check: async ov => {
        try {
          const path = isNew ? "/api/rcv/save_new" : "/api/rcv/save_edit", base = isNew ? {values: vals(ov)} : {token: S.d.token, idx: i, values: vals(ov)};
          const p = await api(path, base, "확인 중...");
          if (!await confirmBox(p.msg, isNew ? "소재 입고 등록" : "소재 입고 수정", isNew ? "등록" : "저장", !!p.warn)) return false;
          const r = await api(path, {...base, confirm: true}, "MES에 저장 중...");
          if (isNew) {
            if (S.d) { if (r.date > q(".r-d2").value) q(".r-d2").value = r.date; if (r.date < q(".r-d1").value) q(".r-d1").value = r.date; }
            fetch();
            if ($("#rf_keep", ov).checked) { $("#rf_heat", ov).value = ""; noAuto = true; suggestNo(ov); const n = $("#rf_info", ov); n.textContent = `✔ ${r.no} 등록 완료 (${r.smsg}).  다음 코일 HEAT_NO·중량을 넣으세요.`; n.className = "note good"; $("#rf_heat", ov).focus(); return false; }
            await alertBox(`소재 입고를 등록했습니다: ${r.no}\n${r.smsg}`);
          } else { await alertBox(`저장했습니다: ${r.no}\n${r.res}`); fetch(); }
          return true;
        } catch (e) { showErr(e); return false; }
      }}],
      onOpen: ov => {
        new Suggest($("#rf_item", ov), {items: F.items.map(x => [x, x]), rows: 16, onPick: () => lookup(ov)});
        new Suggest($("#rf_vendor", ov), {items: F.vendors.map(x => [x, x]), rows: 16});
        $("#rf_item", ov).addEventListener("change", () => lookup(ov));
        $("#rf_item", ov).addEventListener("keydown", e => { if (e.key === "Enter") lookup(ov); });
        $("#rf_find", ov).onclick = async () => { const x = await findItem($("#rf_item", ov).value, "/api/rcv/item_find", false); if (x !== null) { $("#rf_item", ov).value = x; lookup(ov); } };
        if (isNew) { $("#rf_no", ov).addEventListener("keydown", () => noAuto = false); $("#rf_date", ov).onchange = () => suggestNo(ov); suggestNo(ov); }
        if (v.item) lookup(ov);
      }});
    async function lookup(ov){
      const it = $("#rf_item", ov).value.trim(), n = $("#rf_info", ov);
      if (!it) return;
      try {
        const j = await api("/api/rcv/item_lookup", {item: it}, "품번 확인 중...");
        n.textContent = j.text; n.className = "note " + (j.n ? "good" : "bad");
        if (isNew && j.last_vendor && !$("#rf_vendor", ov).value.trim()) $("#rf_vendor", ov).value = F.vendors.find(x => x.split(" | ")[0] === j.last_vendor) || j.last_vendor;
      } catch (e) {}
    }
    async function suggestNo(ov){
      if (!noAuto) return;
      try {
        const j = await api("/api/rcv/next_no", {date: $("#rf_date", ov).value}, "입고번호 확인 중...");
        $("#rf_no", ov).value = j.no; noAuto = true;
        const n = $("#rf_noinfo", ov);
        if (j.same) { n.textContent = `제안 번호 (같은 날 마지막: ${j.same})`; n.className = "note good"; }
        else { n.textContent = `이 날 첫 입고 - 최근 번호 ${F.last_no} 와 형식을 비교하세요`; n.className = "note bad"; }
      } catch (e) {}
    }
  }
};

BUILD.spm = sec => {
  sec.insertAdjacentHTML("beforeend", `
    <div class="bar"><span>찾기</span><input type="text" class="s-q" style="width:200px"><button class="b-green b-big s-new">+ 새로 등록</button><button class="b-blue b-big s-edit">선택 SPM 고치기</button>
      <button class="b-red b-big s-del">선택 줄 삭제</button><button class="s-miss">SPM 없는 품번 찾기 (최근 30일 작업)</button><span class="sp"></span>
      <button class="b-teal s-imp">엑셀에서 가져오기</button><button class="b-teal s-down">엑셀 파일 받기</button><button class="b-blue s-load">새로고침</button></div>
    <div class="legend">줄 더블클릭 = 고치기.  계획수량 = SPM × 60 × 근무시간 × 캐비티.  서버의 spm.xlsx 에 저장 (MES는 바뀌지 않음, PC 프로그램과 같은 파일)</div>
    <div class="s-box"></div><div class="status s-st"></div>`);
  const q = s => $(s, sec);
  const T = new Table(q(".s-box"), {sort: true, emptyText: "읽는 중...", noRows: "등록된 SPM이 없습니다.", cellCls: (i, c) => c === 1 ? "num" : "", onDbl: i => edit(T.rows[i]), onSel: () => st()});
  const st = () => q(".s-st").textContent = `SPM 등록 ${T.rows.length.toLocaleString()}개` + (T.q ? `  /  찾기 ${T.view.length.toLocaleString()}개` : "") + (T.sel.size ? `  /  선택 ${T.sel.size}` : "");
  const load = guard(async (sel) => {
    const j = await api("/api/spm/list", {}, "SPM 읽는 중...");
    T.set(["품번", "SPM", "수정일", "수정자", "비고"], j.rows); T.filter(q(".s-q").value);
    if (sel) { const i = T.rows.findIndex(r => r[0] === sel); if (i >= 0) { T.sel.add(i); T.refreshSel(); } }
    st();
  });
  async function edit(r, item, note){
    const isNew = !r;
    const res = await dialog({title: isNew ? "SPM 새로 등록" : `SPM 고치기 - ${r[0]}`,
      html: `<div class="form"><span class="lab">품번</span><span><input type="text" id="sp_it" value="${esc(isNew ? (item || "") : r[0])}" style="width:220px"${isNew ? "" : " readonly"}></span>
        <span class="lab">SPM</span><span><input type="text" id="sp_v" value="${esc(isNew ? "" : r[1])}" inputmode="decimal" style="width:100px"> <span class="hint">(분당 타수)</span></span>
        <span class="lab">비고</span><span><input type="text" id="sp_n" value="${esc(isNew ? (note || "") : r[4])}" style="width:100%"></span></div>`,
      buttons: [{t: "취소", v: null}, {t: "저장", c: "b-green", get: ov => ({item: $("#sp_it", ov).value, spm: $("#sp_v", ov).value, note: $("#sp_n", ov).value})}],
      onOpen: ov => { if (!isNew || item) setTimeout(() => $("#sp_v", ov).focus(), 50); $$("input", ov).forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") $(".ft button:last-child", ov).click(); })); }});
    if (!res) return;
    try {
      let j = await api("/api/spm/save", {...res, new: isNew}, "저장 중...");
      if (j.ask) { if (!await confirmBox(j.ask)) return; j = await api("/api/spm/save", {...res, new: isNew, force: true}, "저장 중..."); }
      load(j.item);
    } catch (e) { showErr(e); }
  }
  q(".s-q").oninput = e => { T.filter(e.target.value); st(); };
  q(".s-new").onclick = () => edit(null);
  q(".s-edit").onclick = () => { if (T.sel.size !== 1) return alertBox("고칠 줄 1개를 선택하세요."); edit(T.rows[T.picked()[0]]); };
  q(".s-del").onclick = guard(async () => {
    const sel = T.picked().map(i => T.rows[i][0]);
    if (!sel.length) return alertBox("삭제할 줄을 선택하세요. (여러 줄: Ctrl/Shift+클릭)");
    if (!await confirmBox(`SPM ${sel.length}개를 삭제합니다.\n${sel.slice(0, 10).join(", ")}${sel.length > 10 ? ` 외 ${sel.length - 10}개` : ""}\n\n계속할까요?`, "SPM 삭제", "삭제", true)) return;
    await api("/api/spm/delete", {items: sel}, "삭제 중..."); load();
  });
  q(".s-load").onclick = () => load();
  q(".s-down").onclick = guard(() => apiFile("/api/spm/download", {}));
  q(".s-imp").onclick = guard(async () => {
    const f = await pickFile(); if (!f) return;
    let j = await api("/api/spm/import", {b64: f.b64, name: f.name}, "엑셀 읽는 중...");
    if (j.ask) { if (!await confirmBox(j.ask)) return; j = await api("/api/spm/import", {b64: f.b64, name: f.name, confirm: true}, "반영 중..."); }
    await alertBox(j.msg); load();
  });
  q(".s-miss").onclick = guard(async () => {
    const j = await api("/api/spm/missing", {}, "최근 30일 작업 품번 확인 중...");
    if (!j.rows.length) return alertBox(`최근 30일 작업 품번 ${j.total}개 모두 SPM이 등록되어 있습니다.`);
    dialog({title: `SPM 없는 품번 - 최근 30일 작업 ${j.rows.length}개`, cls: "mid", html: `<div class="hint">줄 더블클릭 = 이 품번 SPM 등록.  SPM이 없으면 최근 생산 기록으로 계산합니다.</div><div class="tbox fix mt"></div>`,
      onOpen: ov => new Table($(".mt", ov), {check: false, sort: true, onDbl: i => edit(null, j.rows[i][0], j.rows[i][1])}).set(["품번", "품명", "작업 횟수", "마지막 작업일", "최근 설비"], j.rows)});
  });
  load();
};

/* ============================================================
   금형 간편등록 (숨김 탭)

BUILD.quick = sec => {
  const QF = META.quick_fields;
  sec.insertAdjacentHTML("beforeend", `
    <fieldset><legend>① 비슷한 기존 금형 고르기 (회사코드·그룹 등 나머지 칸을 이 금형에서 복사합니다)</legend>
      <div class="bar"><input type="text" class="k-bq" style="width:180px" placeholder="금형코드·금형명 일부"><button class="b-blue k-find">찾기</button><select class="k-base" style="min-width:280px;max-width:100%"></select><span class="hint k-blbl">금형코드·금형명 일부를 넣고 [찾기] (비우고 누르면 전체 목록)</span></div></fieldset>
    <fieldset><legend>② 새 금형 정보</legend><div class="grid4">${QF.map(([c, l]) => `<label>${esc(l)}</label><input type="text" data-c="${c}">`).join("")}</div></fieldset>
    <fieldset style="flex:1;display:flex;flex-direction:column;min-height:240px"><legend>③ 이 금형으로 만드는 품번 (품번 하나는 금형 하나에만 연결됩니다)</legend>
      <div class="bar"><button class="b-green k-add">+ 품번 추가</button><button class="k-del">선택 삭제</button><span class="hint">원소재·단위중량·캐비티는 칸에서 바로 고치기.  피치당 소재중량(g) = 두께×폭×피치×7.85÷1000 (스크랩 포함, 캐비티 2↑는 ÷캐비티)</span></div>
      <div class="k-box tbox"></div></fieldset>
    <div class="bar"><button class="b-blue b-big k-check">④ 검사</button><button class="b-green b-big k-reg">⑤ MES에 등록</button><button class="k-reset">새로 시작</button><b class="k-lbl">(검사 전)</b></div>`);
  const q = s => $(s, sec);
  const K = {base: "", items: [], drawFollow: false, sel: new Set()};
  const field = c => $(`input[data-c="${c}"]`, sec);
  const invalidate = () => { q(".k-lbl").textContent = "(검사 전)"; q(".k-lbl").className = "k-lbl"; };
  function draw(){
    q(".k-box").innerHTML = `<table class="g"><thead><tr><th></th><th>품번</th><th>품명</th><th>원소재(코일) 코드</th><th>피치당 소재중량(g)</th><th>캐비티</th><th>상태</th></tr></thead><tbody>${K.items.map((it, k) =>
      `<tr class="${it.level || ""}"><td><input type="checkbox" data-s="${k}"${K.sel.has(k) ? " checked" : ""}></td><td>${esc(it.item)}</td><td>${esc(it.name)}</td>
        <td><input type="text" class="cell" data-k="${k}" data-f="raw" value="${esc(it.raw)}"></td><td><input type="text" class="cell" data-k="${k}" data-f="qpu" value="${esc(it.qpu)}"></td>
        <td><input type="text" class="cell" data-k="${k}" data-f="cav" value="${esc(it.cav)}" style="min-width:60px"></td><td class="wrap">${esc(it.note)}</td></tr>`).join("")}</tbody></table>`;
    $$("input[data-f]", sec).forEach(el => el.oninput = () => { K.items[+el.dataset.k][el.dataset.f] = el.value; invalidate(); });
    $$("input[data-s]", sec).forEach(el => el.onchange = () => el.checked ? K.sel.add(+el.dataset.s) : K.sel.delete(+el.dataset.s));
  }
  const body = () => ({base: K.base, fields: Object.fromEntries(QF.map(([c]) => [c, field(c).value])), items: K.items});
  q(".k-bq").onkeydown = e => { if (e.key === "Enter") q(".k-find").click(); };
  q(".k-find").onclick = guard(async () => {
    const j = await api("/api/quick/find", {q: q(".k-bq").value}, "금형 찾는 중...");
    q(".k-base").innerHTML = j.rows.map(([a, b]) => `<option value="${esc(a)}">${esc(a)}  |  ${esc(b)}</option>`).join("");
    if (!j.rows.length) { q(".k-blbl").textContent = "찾은 금형이 없습니다."; q(".k-blbl").className = "hint red k-blbl"; return; }
    q(".k-blbl").textContent = `${j.rows.length}개 찾음 - 목록에서 고르면 아래 칸이 채워집니다`; q(".k-blbl").className = "hint k-blbl";
    loadBase();
  });
  q(".k-base").onchange = () => loadBase();
  const loadBase = guard(async () => {
    const code = q(".k-base").value; if (!code) return;
    const j = await api("/api/quick/base", {code}, "기준 금형 읽는 중...");
    K.base = code; K.drawFollow = j.drawing_follows;
    Object.entries(j.vals).forEach(([c, v]) => { const el = field(c); if (el) el.value = v; });
    const need = field("MOLD_CODE").value.trim() ? "" : "  → 새 금형코드를 넣고 금형명을 고치세요";
    q(".k-blbl").textContent = `기준: ${code} (${j.name})${need}` + (j.has_link ? "" : "  ※ 이 금형은 품번 연결이 없어 품번연결 칸은 다른 금형 형식으로 채웁니다");
    invalidate();
  });
  field("MOLD_CODE").oninput = () => { if (K.drawFollow && field("DRAWING_NO")) field("DRAWING_NO").value = field("MOLD_CODE").value.trim(); invalidate(); };
  $$(".grid4 input", sec).forEach(el => { if (el.dataset.c !== "MOLD_CODE") el.oninput = invalidate; });
  q(".k-add").onclick = guard(async () => {
    const code = await ask("품번 추가", "제품 품번을 입력하세요:", ""); if (!code || !code.trim()) return;
    if (K.items.some(it => it.item.toUpperCase() === code.trim().toUpperCase())) return alertBox("이미 목록에 있는 품번입니다.");
    const it = await api("/api/quick/item", {item: code.trim(), base: K.base}, "품번 확인 중...");
    const cav = field("CAVITY_QTY").value.trim();
    it.cav = /^\d+(\.\d+)?$/.test(cav) ? cav : "";
    K.items.push(it); draw(); invalidate();
  });
  q(".k-del").onclick = () => { K.items = K.items.filter((_, k) => !K.sel.has(k)); K.sel.clear(); draw(); invalidate(); };
  const showRes = j => {
    K.items = j.items; draw();
    q(".k-lbl").textContent = (j.nerr ? `오류 ${j.nerr}건` : "등록 가능") + (j.nwarn ? ` / 경고 ${j.nwarn}건` : "");
    q(".k-lbl").className = "k-lbl " + (j.nerr ? "red" : "good");
  };
  q(".k-check").onclick = guard(async () => {
    if (!K.base) return alertBox("① 비슷한 기존 금형을 먼저 고르세요.");
    const j = await api("/api/quick/check", body(), "검사 중..."); showRes(j); if (j.errs.length) warnBox(j.errs.join("\n"));
  });
  q(".k-reg").onclick = guard(async () => {
    if (!K.base) return alertBox("① 비슷한 기존 금형을 먼저 고르세요.");
    const p = await api("/api/quick/register", body(), "검사 중...");
    if (p.errs) { showRes(p); return warnBox("④ 검사에서 오류가 있습니다. 빨간 줄과 메시지를 확인하세요.\n\n" + p.errs.join("\n")); }
    if (!await confirmBox(p.msg, "MES에 등록", "등록")) return;
    const r = await api("/api/quick/register", {...body(), confirm: true}, "MES에 등록 중...");
    await alertBox(r.msg); reset(true);
  });
  function reset(keep){ QF.forEach(([c]) => { if (["MOLD_CODE", "MOLD_NAME"].includes(c) || !keep) field(c).value = ""; }); K.items = []; K.sel.clear(); draw(); if (!keep) { K.base = ""; q(".k-base").innerHTML = ""; q(".k-blbl").textContent = "기존 금형코드나 금형명 일부를 넣고 [찾기]"; } invalidate(); }
  q(".k-reset").onclick = () => reset(false);
  q(".k-bq").value = "";
  draw();
};

                  item: new Table(q(".n-item"), {check: false, emptyText: "", rowCls: i => cls("item", i), onDbl: i => detail("item", i)})};

function codeWindow(title, text){
  dialog({title, cls: "wide", html: `<div class="bar"><span>찾기</span><input type="text" class="cq" style="width:220px"><span class="hint cn"></span><span class="sp"></span><button class="cc">전체 복사</button></div><pre class="code"></pre>`,
    onOpen: ov => {
      const p = $("pre.code", ov);
      const paint = qv => {
        let h = esc(text).replace(/^.*\b(INSERT|UPDATE|DELETE|MERGE)\b.*$/gim, m => `<b style="color:#c00000">${m}</b>`);
        let n = 0;
        if (qv) { const re = new RegExp(qv.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"); h = h.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt) => tag ? tag : txt.replace(re, x => { n++; return `<mark>${x}</mark>`; })); }
        p.innerHTML = h; $(".cn", ov).textContent = qv ? `${n}곳` : "";
        const f = $("mark", p); if (f) f.scrollIntoView({block: "center"});
      };
      $(".cq", ov).oninput = e => paint(e.target.value.trim());
      $(".cc", ov).onclick = async () => { try { await navigator.clipboard.writeText(text); $(".cn", ov).textContent = "전체 복사됨"; } catch (e) { $(".cn", ov).textContent = "복사 안 됨 (브라우저 제한) - 직접 선택해서 복사하세요"; } };
      paint("");
    }});
}

  const T = new Table(q(".l-box"), {check: false, sort: true, emptyText: "읽는 중...", noRows: "아직 기록이 없습니다.", cellCls: (i, c) => c === 5 ? "wrap" : "", onDbl: i => alertBox(T.rows[i].join("\n"), "작업기록")});
  const load = guard(async () => { const j = await api("/api/log/list", {q: q(".l-q").value}, "기록 읽는 중..."); T.set(j.cols, j.rows); q(".l-st").textContent = `${j.total.toLocaleString()}건` + (j.total > j.rows.length ? ` (최근 ${j.rows.length}건 표시)` : ""); });
  q(".l-load").onclick = load; q(".l-q").onkeydown = e => { if (e.key === "Enter") load(); };
  q(".l-file").onclick = guard(() => apiFile("/api/log/file", {}));
  q(".l-bak").onclick = guard(() => apiFile("/api/log/file", {kind: "backup"}));
  sec.onShow = load;
};
BUILD.help = sec => {
  let h = "";
  META.help.forEach(([k, t]) => { h += k === "h1" ? `<h1>${esc(t)}</h1>` : k === "h2" ? `<h2>${esc(t)}</h2>` : k === "p" ? `<p>${esc(t).replace(/\n/g, "<br>")}</p>` : `<li>${esc(t).replace(/^ {3}/, "&nbsp;&nbsp;&nbsp;")}</li>`; });
  h += `<h2>웹 화면 안내</h2><li>이 화면은 서버 PC의 기존 프로그램(${esc(META.program)})을 그대로 불러와 같은 규칙으로 MES를 고칩니다. 설정·SPM·작업기록 파일도 같이 씁니다.</li>
    <li>오른쪽 위 [작업자]에 이름을 넣으면 작업기록에 이름이 남습니다.</li><li>숨겨 둔 탭은 [환경설정]에서 체크하면 모든 접속자에게 나타납니다.</li>
    <li>폰에서는 줄을 눌러 선택한 뒤 [선택 ... 고치기] 버튼을 쓰세요. (두 번 탭 = 더블클릭)</li>`;
  sec.insertAdjacentHTML("beforeend", `<div class="help">${h}</div>`);
};

/* ============================================================
   시작
   ============================================================ */
async function ping(){
  try { await api("/api/ping", {}, "MES 접속 확인 중..."); $("#db .dot").className = "dot ok"; $("#dbt").textContent = "MES 연결됨"; $("#db").title = ""; }
  catch (e) { $("#db .dot").className = "dot bad"; $("#dbt").textContent = "MES 연결 안 됨"; $("#db").title = e.message; }
}
(async () => {
  $("#who").value = LS.get("who", "");
  $("#who").onchange = () => LS.set("who", $("#who").value.trim());
  try {
    const r = await fetch("/api/meta", {method: "POST", headers: headers(), body: "{}"});
    META = await r.json();
  } catch (e) { document.body.innerHTML = `<div class="empty">서버에 연결할 수 없습니다. 서버 PC의 서버 창이 켜져 있는지 확인하세요.</div>`; return; }
  $("#apptitle").textContent = META.app_title + " (웹)";
  document.title = META.app_title + " (웹)";
  if (META.pin && !PIN) { const p = await ask("PIN 입력", "접속 PIN을 넣으세요.", "", "password"); if (p !== null) { PIN = p; try { sessionStorage.setItem("pin", p); } catch(e) {} } }
  CUR = null;
  renderTabs();
  const want = LS.get("tab", "old");
  showTab(visibleTabs().some(([k]) => k === want) ? want : "old");
  ping();
  if (!$("#who").value) $("#who").focus();
})();
</script>
